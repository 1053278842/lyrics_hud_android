plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.lyrichud'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lyrichud"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // 只保留手机常用的两个 ABI，APK 体积能小一半
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            // Windows 上必须显式告诉 Chaquopy 用哪个 Python 来打包依赖：
            //   ./gradlew assembleDebug -PbuildPython=C:/Python311/python.exe
            // 或者设环境变量 CHAQUOPY_BUILD_PYTHON
            // Linux / macOS 不填也能自动找到 python3
            def buildPy = project.findProperty("buildPython") ?: System.getenv("CHAQUOPY_BUILD_PYTHON")
            if (buildPy) {
                buildPython buildPy
            }

            // App 只走酷狗这条路（main.py → LyricsAdapterFactory → Kugou），
            // 所以只装它真正 import 的两个包。
            // Spotify 那套（api/totp/SpotifyLyricsListener）没有打进 APK。
            pip {
                install "requests==2.32.3"
                install "ll-kugou-lyric-api==0.1.4"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// Python 源码在 app/src/main/python（Chaquopy 默认路径）。
// 它是从 LyricsDisplay 仓库同步过来的：
//   bash scripts/sync_python.sh
// 不要直接改这里的 main.py / lyrics/，改上游再同步。

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}